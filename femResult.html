<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Female Match Results</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f4f4;
            padding: 20px;
        }
        h1 {
            color: #3498db;
        }
        table {
            width: 50%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            background: #5f055d;
            color: white;
        }
        .delete-btn {
            padding: 5px 10px;
            background: #e74c3c;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .delete-btn:hover {
            background: #c0392b;
        }
        button {
            background-color: #f39c12;
    color: white;
    border: none;
    padding: 10px 15px;
    margin-top: 10px;
    font-size: 1em;
    border-radius: 5px;
    cursor: pointer;
    transition: 0.3s;
        }
        button:hover {
            background: #27ae60;
        }
    </style>
</head>
<body>
    
    <div id="femaleGameInfo"></div>

    <table>
        <thead>
            <tr>
                <th>Team</th>
                <th>Total Points</th>
                <th>Points</th>
            </tr>
        </thead>
        <tbody id="historyTable"></tbody>
    </table>
    
    <button onclick="goBack()">Back</button>

    <script>
        function displayFemaleMatchHistory() {
            const historyTable = document.getElementById("historyTable");
            const matchHistory = JSON.parse(localStorage.getItem("matchHistory")) || [];

            document.getElementById("femaleGameInfo").innerHTML = "<h3>Female Match History</h3>";

            let teams = [];
            matchHistory.filter(match => match.teamGender === "Female").forEach(match => {
                teams.push({ team: match.aTeam, totalPoints: match.totalPointsA, Points: match.winningPoints });
                teams.push({ team: match.bTeam, totalPoints: match.totalPointsB, Points: match.winningPoints });
            });

            teams.sort((a, b) => b.totalPoints - a.totalPoints);

            if (teams.length === 0) {
                document.getElementById("femaleGameInfo").innerHTML += "<p>No female match history available.</p>";
                return;
            }

            teams.forEach((entry, index) => {
                let row = document.createElement("tr");
                row.innerHTML = `
                    <td>${entry.team}</td>
                    <td>${entry.totalPoints}</td>
                    <td>${entry.Points}</td>
                `;
                historyTable.appendChild(row);
            });
        }

        function deleteMatch(index) {
            let matchHistory = JSON.parse(localStorage.getItem("matchHistory")) || [];
            matchHistory.splice(index, 1);
            localStorage.setItem("matchHistory", JSON.stringify(matchHistory));
            location.reload(); 
        }

        function goBack() {
            window.location.href = "Results.html"; 
        }

        displayFemaleMatchHistory();
    </script>
</body>
</html>
