<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volleyball Game Score Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; color:rgb(13, 119, 224);  background-image: url('VollyPass.jpg'); background-repeat: no-repeat;background-size: cover;}
        input { margin-bottom: 10px; }
        .game-info { margin-top: 20px; }
    
        legend { font-weight: bold; }
        fieldset {
    width: 50%;
    border: 2px solid #4aa9df;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 20px;
    text-align: center;
    justify-items: center;
}

form {
    background: rgba(0, 0, 0, 0.7); 
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
    width: 85%;
    color: hsl(300, 6%, 94%);
    display: flex;
    flex-direction: column;
    align-items: center;
}


button {
    background-color: #f39c12;
    color: white;
    border: none;
    padding: 10px 15px;
    margin-top: 10px;
    font-size: 1em;
    border-radius: 5px;
    cursor: pointer;
    transition: 0.3s;

}

.button-container {
  display: flex;
  justify-content: right;
  margin-top: 10px;
 
}



 .game-info{background-color: azure;}
button:hover {
    background-color: #e67e22;
}

        #live-time { font-size: 1em; font-weight: bold;  color: #3dbee9; text-align: right; }
        #head{ font-size: 2em; font-weight: bold; color: #eeeff3;  border-radius: 10px; text-align: center;  }
    </style>
</head>
<body >
 

  <div id="head">Volleyball Game Score Tracker    </div>
  
  <div class =button-container>
  <button  type="signout" onclick = "Signout()" id ="btns">Sign_out</button>
</div>


    <form id="scoreForm">

         <fieldset>

            <legend><strong>Match Date and Time</strong></legend>
            <label for=""matchDate><Strong>Select Date</Strong></label>
             <div style="position: relative; display: inline-block;">
            <input type="date"  id ="matchDate"  required  style="padding-right: 30px;">
            <input type ="file" width="20px" height="25px" multiple  accept=".pdf" id="fixture" >
                </div>
             
            
                
            </fieldset>
        <fieldset>
            <legend><strong>Teams</strong></legend>
            <label for="aTeam"><strong>Team A:</strong> </label>
            <input type="text" id="aTeam" required><br>

            <label for="bTeam"><strong>Team B:</strong> </label>
            <input type="text" id="bTeam" required><br>

            <label for="pool"><strong>Pool No:</strong> </label>
            <input type="text" id="pool" required>

            <fieldset>
            <legend><strong>Team Category</strong></legend>
            <label for="maleTeam">Male:</label>
            <input type="radio" id="male" name ="teamGender" value="Male" required>
            <label for="maleTeam">Female:</label>
            <input type="radio" id="female" name ="teamGender" value="Female" required>
            
            
            
        </fieldset>


        </fieldset>

        
        <fieldset>
            <legend><strong>Game Sets</strong></legend>
            <label for="set1">First Set: </label><br>
            <label for="set1TeamA">A: </label>
            <input type="number" id="set1TeamA" required> 
            vs    B: <input type="number" id="set1TeamB" required><br><br>

            <label for="set2">Second Set: </label><br>
            <label for="set2TeamA">A: </label>
            <input type="number" id="set2TeamA" required> 
            vs    B: <input type="number" id="set2TeamB" required><br><br>

            <label for="set3">Third Set: </label><br>
            <label for="set3TeamA">A: </label>
            <input type="number" id="set3TeamA" required> 
            vs    B: <input type="number" id="set3TeamB" required><br>
        
       </fieldset>
        
        <fieldset>
            <legend><strong>Officials</strong></legend>
            <label for="skeeper"><strong>Score Keeper: </strong></label>
            <input type="text" id="skeeper" required><br>
            
            <label for="ref1"><strong>Ref1: </strong></label>
            <input type="text" id="ref1" required>
            
            <label for="ref2"><strong>     Ref2: </strong></label>
            <input type="text" id="ref2" required><br>

            <label for="line1"><strong>Line 1: </strong></label>
            <input type="text" id="line1" required>

            <label for="line2"><strong>Line 2: </strong></label>
            <input type="text" id="line2" required><br>

            <label for="line3"><strong>Line 3: </strong></label>
            <input type="text" id="line3" required>

            <label for="line4"><strong>Line 4: </strong></label>
            <input type="text" id="line4" required><br>
        </fieldset>

    

        <button type="submit"  onClick = "successFull()">Submit Match</button>


    </form>

   
    <script src="app.js"></script>
    

</body>
</html>
